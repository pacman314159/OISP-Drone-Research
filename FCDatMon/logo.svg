<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24" />
      <stop offset="100%" stop-color="#090A0C" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="30" fill="url(#bgGrad)" stroke="#2A303C" stroke-width="4"/>

  <g stroke="#2A303C" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="0" y1="133" x2="400" y2="133" />
    <line x1="0" y1="266" x2="400" y2="266" />
    <line x1="133" y1="0" x2="133" y2="300" />
    <line x1="266" y1="0" x2="266" y2="300" />
  </g>

  <path d="M 40 180 Q 80 100, 140 180 T 260 180 T 360 180" 
        fill="none" stroke="#00FFCC" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  
  <path d="M 40 220 Q 100 300, 160 220 T 280 220 T 360 220" 
        fill="none" stroke="#FF0055" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 5" filter="url(#glow)"/>

  <g transform="translate(200, 170)">
    <line x1="-35" y1="-35" x2="35" y2="35" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="-35" y1="35" x2="35" y2="-35" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    
    <circle cx="-35" cy="-35" r="12" fill="none" stroke="#FFD700" stroke-width="3" filter="url(#glow)"/>
    <circle cx="35" cy="-35" r="12" fill="none" stroke="#FFD700" stroke-width="3" filter="url(#glow)"/>
    <circle cx="-35" cy="35" r="12" fill="none" stroke="#FFD700" stroke-width="3" filter="url(#glow)"/>
    <circle cx="35" cy="35" r="12" fill="none" stroke="#FFD700" stroke-width="3" filter="url(#glow)"/>
    
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="#00FFCC" filter="url(#glow)"/>
  </g>

  <text x="200" y="335" font-family="'Courier New', monospace" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    FCDatMon
  </text>
  
  <text x="200" y="365" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00FFCC" text-anchor="middle" letter-spacing="4">
    OISP DRONE RESEARCH
  </text>
</svg>
