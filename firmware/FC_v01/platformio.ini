; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---- Shared settings (inherited by all [env:*] sections) ----

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_port = COM7
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
process_num_jobs = 4

build_flags =
    -I src/
    -Wno-error=implicit-function-declaration
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DBOARD_HAS_PSRAM

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1

; ---- Unified Environment: UART Upload/Monitor (COM7) + USB-JTAG Debugging & SysView ----
[env:fc-v01]
upload_port = COM7
upload_protocol = esptool
debug_tool = esp-builtin
debug_init_break = tbreak setup

; ---- BLE OTA Environment: Custom Upload via Bluetooth Low Energy ----
[env:fc-v01-ota]
upload_protocol = custom
upload_command = python tools/ble_ota_uploader.py "$SOURCE"


; Or run the Python command independently to just upload, not recompile
; python tools/ble_ota_uploader.py .pio/build/fc-v01-ota/firmware.bin
; add --window <4 or 8> to lower or increase the upload speed

